name: Build DMC Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and package DMC APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb" || true
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android Gradle project
        run: test -f android/settings.gradle && test -f android/app/build.gradle

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
